<!-- Floating Trigger Orb -->
<div class="ai-trigger-wrap" [class.open]="isOpen">
  <button class="ai-fab-button" (click)="toggleChat()" title="Open AI Virtual HR Assistant" aria-label="Open HR Copilot">
    <div class="orb-glow"></div>
    <div class="orb-icon">
      <!-- Robot icon when closed -->
      <svg *ngIf="!isOpen" viewBox="0 0 16 16" width="28" height="28" fill="currentColor">
        <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.881a7 7 0 0 1 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-1.54.498-2.235.848a6.5 6.5 0 0 1-4 0c-.695-.35-1.39-.7-2.235-.848A.93.93 0 0 1 3 9.22zM2 13h12a1 1 0 0 0 1-1V8.5a1.5 1.5 0 0 0-1.5-1.5c-.32 0-.623.076-.89.213C12.046 5.86 10.74 5 9.25 5H6.75C5.26 5 3.954 5.86 3.39 7.213A1.5 1.5 0 0 0 2 8.5V12a1 1 0 0 0 1 1"/>
      </svg>
      <!-- Cross mark when open -->
      <svg *ngIf="isOpen" viewBox="0 0 16 16" width="22" height="22" fill="currentColor">
        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
      </svg>
    </div>
    <span class="ai-fab-badge" *ngIf="!isOpen">AI</span>
  </button>
  <span class="ai-tooltip" *ngIf="!isOpen">Ask HR Copilot</span>
</div>

<!-- Floating Chat Overlay Panel -->
<div class="ai-chat-panel glass-modal" *ngIf="isOpen">
  <!-- Panel Header -->
  <div class="chat-header">
    <div class="header-assistant-info">
      <div class="assistant-avatar">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
          <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.881a7 7 0 0 1 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-1.54.498-2.235.848a6.5 6.5 0 0 1-4 0c-.695-.35-1.39-.7-2.235-.848A.93.93 0 0 1 3 9.22zM2 13h12a1 1 0 0 0 1-1V8.5a1.5 1.5 0 0 0-1.5-1.5c-.32 0-.623.076-.89.213C12.046 5.86 10.74 5 9.25 5H6.75C5.26 5 3.954 5.86 3.39 7.213A1.5 1.5 0 0 0 2 8.5V12a1 1 0 0 0 1 1"/>
        </svg>
        <span class="online-indicator"></span>
      </div>
      <div>
        <h3 class="assistant-name">EMS HR Copilot</h3>
        <p class="assistant-status">Virtual Workforce Assistant &bull; Always Active</p>
      </div>
    </div>

    <div class="chat-header-actions">
      <!-- Clear conversation button -->
      <button class="btn-chat-tool" (click)="clearChat()" title="Clear conversation" aria-label="Clear chat">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
        </svg>
      </button>
      <!-- Minimise button -->
      <button class="btn-chat-tool" (click)="closeChat()" title="Minimize chat" aria-label="Minimize chat">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8"/>
        </svg>
      </button>
      <!-- Cross mark close button -->
      <button class="btn-chat-tool btn-close-tool" (click)="closeChat()" title="Close chat" aria-label="Close chat">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages Stream Area -->
  <div class="chat-messages" #scrollContainer>
    <div *ngFor="let msg of messages" class="message-row" [ngClass]="msg.sender">
      <!-- Assistant Avatar -->
      <div class="message-avatar assistant-avatar" *ngIf="msg.sender === 'assistant'">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.881a7 7 0 0 1 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-1.54.498-2.235.848a6.5 6.5 0 0 1-4 0c-.695-.35-1.39-.7-2.235-.848A.93.93 0 0 1 3 9.22zM2 13h12a1 1 0 0 0 1-1V8.5a1.5 1.5 0 0 0-1.5-1.5c-.32 0-.623.076-.89.213C12.046 5.86 10.74 5 9.25 5H6.75C5.26 5 3.954 5.86 3.39 7.213A1.5 1.5 0 0 0 2 8.5V12a1 1 0 0 0 1 1"/>
        </svg>
      </div>

      <!-- User Avatar -->
      <div class="message-avatar user-avatar" *ngIf="msg.sender === 'user'">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
        </svg>
      </div>

      <div class="message-bubble-wrap">
        <div class="message-bubble">
          <!-- Formatted Message Body -->
          <div class="message-text" [innerHTML]="formatMessage(msg.text)"></div>

          <!-- Deep-Link Quick Navigation Actions -->
          <div *ngIf="msg.actions && msg.actions.length > 0" class="action-links-wrap">
            <span class="action-label">
              <i class="bi bi-link-45deg"></i> Direct Actions:
            </span>
            <div class="action-buttons-list">
              <button *ngFor="let act of msg.actions" class="btn-action-chip" (click)="navigateAction(act)">
                <span class="action-chip-content">
                  <i [class]="getActionIcon(act)" class="action-chip-icon"></i>
                  <span>{{ getActionLabel(act) }}</span>
                </span>
                <i class="bi bi-arrow-right action-chip-arrow"></i>
              </button>
            </div>
          </div>

          <!-- Message Utility Toolbar (Copy for Assistant) -->
          <div *ngIf="msg.sender === 'assistant'" class="bubble-actions">
            <button class="btn-copy-bubble" (click)="copyMessage(msg)" [title]="copiedMsgId === msg.id ? 'Copied!' : 'Copy response'">
              <svg *ngIf="copiedMsgId !== msg.id" viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
                <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
                <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
              </svg>
              <svg *ngIf="copiedMsgId === msg.id" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" class="text-emerald">
                <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
              </svg>
              <span *ngIf="copiedMsgId === msg.id" class="copy-feedback">Copied</span>
            </button>
          </div>
        </div>

        <div class="message-meta">
          <span class="message-time">{{ msg.timestamp }}</span>
        </div>

        <!-- Follow-up Suggestion Chips -->
        <div *ngIf="msg.suggestions && msg.suggestions.length > 0" class="suggestions-row">
          <button *ngFor="let sug of msg.suggestions" class="suggestion-chip" (click)="sendMessage(sug)">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" class="text-amber">
              <path d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13a.5.5 0 0 1 0 1 .5.5 0 0 1 0 1l-.224.447a1 1 0 0 1-.894.553H6.618a1 1 0 0 1-.894-.553L5.5 15a.5.5 0 0 1 0-1 .5.5 0 0 1 0-1 .5.5 0 0 1-.46-.302l-.761-1.77a2 2 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.468c.162-.377.413-.686.676-.94A5 5 0 0 0 8 1"/>
            </svg>
            <span>{{ sug }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Thinking / Typing Indicator -->
    <div *ngIf="isThinking" class="message-row assistant thinking-row">
      <div class="message-avatar assistant-avatar">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.881a7 7 0 0 1 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-1.54.498-2.235.848a6.5 6.5 0 0 1-4 0c-.695-.35-1.39-.7-2.235-.848A.93.93 0 0 1 3 9.22zM2 13h12a1 1 0 0 0 1-1V8.5a1.5 1.5 0 0 0-1.5-1.5c-.32 0-.623.076-.89.213C12.046 5.86 10.74 5 9.25 5H6.75C5.26 5 3.954 5.86 3.39 7.213A1.5 1.5 0 0 0 2 8.5V12a1 1 0 0 0 1 1"/>
        </svg>
      </div>
      <div class="thinking-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </div>

  <!-- Quick Prompts Drawer (If early conversation) -->
  <div *ngIf="messages.length <= 2" class="quick-prompts-bar">
    <span class="quick-title">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" class="text-amber">
        <path d="M11.251.068a.5.5 0 0 1 .227.58L9.677 6.5H13a.5.5 0 0 1 .364.843l-8 8.5a.5.5 0 0 1-.842-.49L6.323 9.5H3a.5.5 0 0 1-.364-.843l8-8.5a.5.5 0 0 1 .615-.09z"/>
      </svg>
      Quick inquiries:
    </span>
    <div class="quick-chips-scroll">
      <button *ngFor="let q of quickSuggestions" class="quick-chip" (click)="sendMessage(q)">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" class="text-indigo">
          <path d="M5 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0m4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0m3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
          <path d="m2.165 15.803.02-.004c1.83-.363 2.948-.842 3.468-1.105A9 9 0 0 0 8 15c4.418 0 8-3.134 8-7s-3.582-7-8-7-8 3.134-8 7c0 1.76.743 3.37 1.97 4.6a10.4 10.4 0 0 1-.524 2.318l-.003.011a11 11 0 0 1-.244.637c-.079.186.074.394.273.362a22 22 0 0 0 .693-.125m.8-3.108a1 1 0 0 0-.287-.801C1.618 10.83 1 9.468 1 8c0-3.192 3.004-6 7-6s7 2.808 7 6-3.004 6-7 6a8 8 0 0 1-2.088-.272 1 1 0 0 0-.711.074c-.387.196-1.24.57-2.634.893a11 11 0 0 0 .398-2"/>
        </svg>
        <span>{{ q }}</span>
      </button>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="chat-input-bar">
    <div class="input-wrapper">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" class="input-prefix-icon text-indigo">
        <path d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936a.361.361 0 0 1-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645a.361.361 0 0 1 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.828zM3.794 1.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387A2.17 2.17 0 0 0 4.593 5.69l-.387 1.162a.217.217 0 0 1-.412 0L3.407 5.69A2.17 2.17 0 0 0 2.31 4.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387A2.17 2.17 0 0 0 3.407 2.31zM10.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.45 1.45 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.45 1.45 0 0 0-.732-.732L9.09 2.137a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/>
      </svg>
      <input 
        type="text" 
        [(ngModel)]="inputText" 
        (keyup.enter)="sendMessage()" 
        placeholder="Ask about leave, payslip, tax, policies..." 
        [disabled]="isThinking" />
      <button class="btn-send" [disabled]="!inputText.trim() || isThinking" (click)="sendMessage()" title="Send query" aria-label="Send message">
        <!-- SVG Send Icon -->
        <svg *ngIf="!isThinking" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" class="send-svg-icon">
          <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/>
        </svg>
        <span *ngIf="isThinking" class="send-spinner"></span>
      </button>
    </div>
  </div>
</div>
